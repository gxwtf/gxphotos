# 示例：nginx 托管原图 + 其余请求反代给 Next。
#
# 把 <PHOTOS_DIR> 换成 .env 里 PHOTOS_DIR 的同一个绝对路径，
# 把 <NEXT_PORT> 换成 Next 实际监听的端口（`pnpm start` 默认 3000；启动时用 `-p` 改过端口就写改后的），然后：
#
#   sudo cp deploy/nginx.example.conf /etc/nginx/sites-available/gxphotos.conf
#   sudo ln -s /etc/nginx/sites-available/gxphotos.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload
#
# 要点：
#   - /photos/ 由 nginx 直接读盘，绝不经过 Node 进程（原图不进 Next，也不进图片优化器）。
#     生产环境下应用内的 /photos/[...path] 路由会直接返回 404 —— 如果访问原图看到这句提示，
#     说明这段 location 没生效或 alias 写错了。
#   - alias 的目录必须以 / 结尾，否则会拼错路径。
#   - 原图目录里只有图片，关闭 autoindex 防止目录遍历列目录。
#   - 缩略图 /thumbs/ 是构建产物，每次 build 会重新生成，可以放心长缓存。
server {
    listen 80;
    server_name example.com;

    # 原图：nginx 直接托管（<PHOTOS_DIR> 必须与 .env 的 PHOTOS_DIR 一致）
    location /photos/ {
        alias <PHOTOS_DIR>/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 其余（页面 / /thumbs 缩略图 / /api / /_next）反代给 Next
    location / {
        proxy_pass http://127.0.0.1:<NEXT_PORT>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # 缩略图是不可变构建产物，可以长缓存
    location /thumbs/ {
        proxy_pass http://127.0.0.1:<NEXT_PORT>;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    client_max_body_size 32m;
}
